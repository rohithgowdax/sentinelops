[project]
name = "sentinelops"
version = "0.1.0"
description = "SentinelOps – AI-native incident intelligence and controlled remediation platform (POC slice 1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohith Gowda R" }]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "redis>=5.0,<6",
    "asyncpg>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "structlog>=24.1,<25",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "tenacity>=8.3,<10",
    "anyio>=4.4,<5",
    "langgraph>=0.2,<2",
    "langchain-core>=0.3,<2",
    "qdrant-client>=1.13.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0,<7",
    "anyio[trio]>=4.4,<5",
    "testcontainers[redis,postgresql]>=4.7,<5",
    "faker>=25.0,<26",
]

[project.scripts]
sentinelops-worker = "sentinelops.ingestion.worker:main"
sentinelops-detector = "sentinelops.detection.runner:main"
sentinelops-api = "sentinelops.api.main:main"
sentinelops-simulator = "sentinelops.simulator.runner:main"
sentinelops-orchestrator = "sentinelops.orchestrator.runner:main"
sentinelops-ingest-knowledge = "sentinelops.knowledge.ingest:main"
sentinelops-eval-retrieval = "sentinelops.evals.run_retrieval_eval:main"
sentinelops-eval-llm = "sentinelops.evals.run_llm_eval:main"


[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require running infrastructure (Redis, PostgreSQL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
